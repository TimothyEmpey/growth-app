<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Growth widget visual QA</title>
  <style>
    :root { color-scheme: dark; --surface:#181c22; --text:#f5f7fc; --muted:#a2a9b8; --track:#303641; --blue:#6b98ff; --purple:#b693f6; --gold:#edc172; --green:#71d8b8; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:1260px; background:#151515; color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif; font-weight:400; }
    main { width:1260px; margin:0; padding:32px; zoom:.42; }
    section { display:grid; grid-template-columns:676px 1fr; grid-template-rows:316px 354px; gap:32px; margin-bottom:48px; }
    .widget { position:relative; overflow:hidden; border:1px solid #343b48; box-shadow:0 14px 26px #0008; }
    .large { width:676px; height:708px; grid-row:1/3; border-radius:45px; padding:44px; }
    .medium { width:676px; height:316px; border-radius:45px; padding:36px; }
    .small { width:316px; height:316px; border-radius:44px; padding:32px; justify-self:center; }
    .weight { background:linear-gradient(35deg,#181c22 60%,#222b3e); }
    .diet { background:linear-gradient(35deg,#181c22 60%,#332f2a); }
    .activity { background:linear-gradient(35deg,#181c22 60%,#20302f); }
    .maxes { background:linear-gradient(35deg,#181c22 60%,#292638); }
    .header { display:flex; align-items:center; gap:18px; }
    .icon { width:54px; height:54px; border-radius:17px; display:grid; place-items:center; flex:none; }
    .icon svg { width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
    .weight .icon { color:var(--blue); background:#252f43; }
    .diet .icon { color:var(--gold); background:#36312b; }
    .activity .icon { color:var(--green); background:#223936; }
    .maxes .icon { color:var(--purple); background:#302c44; }
    h2 { font-size:33px; line-height:1; letter-spacing:-1.2px; margin:0; font-weight:500; }
    .eyebrow { color:var(--muted); font-size:19px; line-height:1; letter-spacing:3px; text-transform:uppercase; }
    .number { font-variant-numeric:tabular-nums; letter-spacing:-3px; font-size:78px; line-height:.92; }
    .unit { color:var(--muted); font-size:27px; letter-spacing:0; }
    .muted { color:var(--muted); }
    .label { font-size:22px; }
    .blue { color:var(--blue); } .purple { color:var(--purple); } .gold { color:var(--gold); } .green { color:var(--green); }
    .weight.large .summary, .activity.large .summary { display:flex; align-items:end; justify-content:space-between; margin-top:72px; }
    .weight.large .summary .right { text-align:right; }
    .weight.large .chart { margin-top:80px; height:230px; }
    .chart svg { width:100%; height:100%; overflow:visible; }
    .grid { stroke:#343b47; stroke-width:1; stroke-dasharray:5 7; }
    .axis { fill:var(--muted); font-size:16px; }
    .line-blue { stroke:var(--blue); } .line-purple{stroke:var(--purple)} .line-gold{stroke:var(--gold)}
    .series { fill:none; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    .point { stroke:#181c22; stroke-width:2; }
    .weight.medium { display:grid; grid-template-columns:245px 1fr; column-gap:28px; }
    .weight.medium h2 { line-height:1.05; width:160px; }
    .weight.medium .value { align-self:end; }
    .weight.medium .number { font-size:68px; }
    .weight.medium .chart { margin-top:10px; height:165px; align-self:center; }
    .small h2 { font-size:29px; }
    .small .header { gap:16px; }
    .small .icon { width:54px; height:54px; }
    .weight.small .value { margin-top:46px; }
    .small .number { font-size:65px; }
    .pill { display:inline-flex; border-radius:999px; padding:10px 16px; font-size:22px; margin-top:17px; background:#252f43; }
    .weight.small .updated { margin-top:18px; font-size:21px; }
    .ring { border-radius:50%; background:conic-gradient(var(--blue) 0 73%,var(--track) 73%); position:relative; display:grid; place-items:center; }
    .ring::after { content:""; position:absolute; inset:13px; border-radius:50%; background:#181c22; }
    .ring > div { z-index:1; text-align:center; }
    .diet.large .body { display:grid; grid-template-columns:290px 1fr; gap:44px; align-items:center; margin-top:70px; }
    .diet.large .ring { width:276px; height:276px; }
    .ring .number { font-size:56px; letter-spacing:-2px; }
    .ring .label { margin-top:10px; }
    .macros { display:grid; gap:36px; }
    .macro-head { display:flex; justify-content:space-between; font-size:22px; margin-bottom:13px; }
    .bar { height:9px; border-radius:8px; background:var(--track); overflow:hidden; }
    .bar i { display:block; height:100%; border-radius:inherit; }
    .diet.large .remaining { position:absolute; left:44px; bottom:42px; font-size:21px; }
    .diet.medium { display:grid; grid-template-columns:220px 1fr; grid-template-rows:60px 1fr; column-gap:38px; }
    .diet.medium .header { grid-column:1/3; }
    .diet.medium .ring { width:176px; height:176px; align-self:center; justify-self:center; }
    .diet.medium .ring .number { font-size:42px; }
    .diet.medium .macros { align-self:center; gap:25px; }
    .diet.small .number { margin-top:22px; font-size:64px; }
    .segments { display:flex; gap:7px; margin-top:17px; }
    .segments i { height:8px; border-radius:8px; }
    .diet.small .pill { color:var(--gold); background:#37332e; }
    .activity.large .summary { margin-top:60px; }
    .activity.large .sports { display:flex; gap:34px; text-align:left; }
    .activity.large .chart { height:238px; margin-top:80px; }
    .legend { display:flex; gap:28px; font-size:18px; color:var(--muted); margin-top:7px; }
    .legend span::before { content:""; display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:8px; background:currentColor; }
    .activity.medium { display:grid; grid-template-columns:230px 1fr; gap:20px; }
    .activity.medium .number { font-size:63px; }
    .activity.medium .value { align-self:end; }
    .activity.medium .chart { height:180px; align-self:center; }
    .activity.small .number { margin-top:10px; }
    .activity.small .split { display:flex; gap:24px; margin-top:26px; font-size:20px; }
    .activity.small .pill { color:var(--green); background:#223936; }
    .maxes.large .records { display:grid; gap:38px; margin-top:70px; }
    .record { display:grid; grid-template-columns:170px 1fr 100px; align-items:center; gap:18px; font-size:25px; }
    .record .bar { height:13px; }
    .record strong { font-size:31px; text-align:right; font-weight:500; }
    .maxes.large .foot { position:absolute; left:44px; bottom:42px; font-size:21px; }
    .maxes.medium { display:grid; grid-template-columns:255px 1fr; gap:30px; }
    .maxes.medium .value { align-self:end; }
    .maxes.medium .number { font-size:65px; }
    .bars { display:flex; align-items:end; justify-content:center; gap:26px; padding-top:40px; height:220px; border-bottom:1px dashed #343b47; }
    .bars div { width:52px; text-align:center; color:var(--muted); font-size:15px; }
    .bars i { display:block; width:52px; border-radius:13px; margin-bottom:15px; }
    .maxes.small .records { display:grid; gap:18px; margin-top:18px; }
    .maxes.small .record { grid-template-columns:1fr auto; font-size:21px; }
    .maxes.small .record strong { font-size:21px; }
  </style>
</head>
<body><main id="root"></main>
<script>
const icons={
 weight:'<svg viewBox="0 0 24 24"><path d="M4 8h16M7 8l-3 7h6L7 8Zm10 0-3 7h6l-3-7ZM12 4v16M9 20h6"/></svg>',
 diet:'<svg viewBox="0 0 24 24"><path d="M5 3v7M8 3v7M5 7h3M6.5 10v11M17 3v18M17 3c3 2 3 8 0 10"/></svg>',
 activity:'<svg viewBox="0 0 24 24"><path d="M2 13h4l2-8 4 15 3-9 2 4h5"/></svg>',
 maxes:'<svg viewBox="0 0 24 24"><path d="m5 16 3 3M16 5l3 3M7 14l3 3 7-7-3-3-7 7ZM3 17l4 4M17 3l4 4"/></svg>'};
const icon=k=>`<div class="icon">${icons[k]}</div>`;
const header=(k,title,eye='')=>`<div class="header">${icon(k)}<div>${eye?`<div class="eyebrow">${eye}</div>`:''}<h2>${title}</h2></div></div>`;
const weightChart=`<svg viewBox="0 0 560 210"><path class="grid" d="M55 15H550M55 80H550M55 145H550M55 205H550"/><text class="axis" x="0" y="20">184</text><text class="axis" x="0" y="85">182</text><text class="axis" x="0" y="150">180</text><text class="axis" x="0" y="210">178</text><path d="M55 40C110 45 130 75 200 77S275 125 335 135 430 190 550 188" fill="none" stroke="#6b98ff" stroke-width="4"/><g fill="#6b98ff"><circle class="point" cx="55" cy="40" r="6"/><circle class="point" cx="200" cy="77" r="6"/><circle class="point" cx="335" cy="135" r="6"/><circle class="point" cx="465" cy="177" r="6"/><circle class="point" cx="550" cy="188" r="6"/></g><text class="axis" x="55" y="235">Sep 1</text><text class="axis" x="505" y="235">Sep 28</text></svg>`;
const miniWeightChart=`<svg viewBox="0 0 300 130"><path class="grid" d="M0 10H300M0 65H300M0 120H300"/><path d="M0 20C55 25 75 58 135 60S200 100 300 118" fill="none" stroke="#6b98ff" stroke-width="4"/><g fill="#6b98ff"><circle class="point" cx="0" cy="20" r="6"/><circle class="point" cx="135" cy="60" r="6"/><circle class="point" cx="300" cy="118" r="6"/></g></svg>`;
const activityChart=`<svg viewBox="0 0 560 210"><path class="grid" d="M0 10H560M0 75H560M0 140H560M0 205H560"/><path class="series line-blue" d="M0 145C80 70 135 60 200 84S310 135 370 110 465 50 560 20"/><path class="series line-purple" d="M0 30C75 55 125 145 210 125S300 60 370 78 455 80 560 45"/><path class="series line-gold" d="M0 188C90 185 125 165 205 168S300 120 370 107 470 78 560 68"/></svg>`;
const weight=`<section><div class="widget large weight">${header('weight','Body weight')}<div class="summary"><div><span class="number">178.6</span> <span class="unit">lb</span><div class="muted label">Last recorded Sep 28</div></div><div class="right"><div class="blue" style="font-size:34px">−3.4 lb</div><div class="muted label">Last 30 days</div></div></div><div class="chart">${weightChart}</div></div><div class="widget medium weight">${header('weight','Body<br>weight')}<div class="value"><span class="number">178.6</span> <span class="unit">lb</span><div class="muted label">−3.4 lb this month</div></div><div class="chart">${miniWeightChart}</div></div><div class="widget small weight">${header('weight','Weight')}<div class="value"><span class="number">178.6</span> <span class="unit">lb</span></div><div class="pill blue">↓ 0.4 lb</div><div class="muted updated">Updated today</div></div></section>`;
const macro=(n,v,g,c,p)=>`<div><div class="macro-head"><span>${n}</span><span class="${c}">${v}${g?` / ${g}`:''} g</span></div><div class="bar"><i style="width:${p}%;background:var(--${c})"></i></div></div>`;
const diet=`<section><div class="widget large diet">${header('diet','Diet','TODAY')}<div class="body"><div class="ring"><div><div class="number">1,450</div><div class="muted label">of 2,000 cal</div></div></div><div class="macros">${macro('Protein',110,150,'blue',73)}${macro('Carbs',150,220,'gold',68)}${macro('Fat',80,100,'purple',80)}</div></div><div class="muted remaining">550 calories remaining</div></div><div class="widget medium diet">${header('diet','Diet','TODAY')}<div class="ring"><div><div class="number">1,450</div><div class="muted label">calories</div></div></div><div class="macros">${macro('Protein',110,'','blue',73)}${macro('Carbs',150,'','gold',68)}${macro('Fat',80,'','purple',80)}</div></div><div class="widget small diet">${header('diet','Diet')}<div class="number">1,450</div><div class="muted label">of 2,000 calories</div><div class="segments"><i style="width:85px;background:var(--blue)"></i><i style="width:108px;background:var(--gold)"></i><i style="width:65px;background:var(--purple)"></i></div><div class="pill">550 remaining</div></div></section>`;
const activity=`<section><div class="widget large activity">${header('activity','Activity','LAST 30 DAYS')}<div class="summary"><div><span class="number">79</span> <span class="unit">mi</span><div class="muted label">Total distance</div></div><div class="sports"><div><b class="blue label">34 mi</b><div class="muted label">Running</div></div><div><b class="purple label">27 mi</b><div class="muted label">Hiking</div></div><div><b class="gold label">18 mi</b><div class="muted label">Walking</div></div></div></div><div class="chart">${activityChart}</div><div class="legend"><span class="blue">Running</span><span class="purple">Hiking</span><span class="gold">Walking</span></div></div><div class="widget medium activity">${header('activity','Activity','30 DAYS')}<div class="value"><span class="number">79</span> <span class="unit">mi</span><div class="muted label">Across 18 activities</div></div><div class="chart">${activityChart}</div></div><div class="widget small activity">${header('activity','Activity')}<div><span class="number">79</span> <span class="unit">mi</span></div><div class="muted label">Last 30 days</div><div class="split"><span class="blue">34 run</span><span class="purple">27 hike</span></div><div class="pill">18 activities</div></div></section>`;
const record=(n,v,c,p)=>`<div class="record"><span class="muted">${n}</span><div class="bar"><i style="width:${p}%;background:var(--${c})"></i></div><strong>${v}</strong></div>`;
const maxes=`<section><div class="widget large maxes">${header('maxes','Maxes','CURRENT RECORDS')}<div class="records">${record('Deadlift',425,'purple',100)}${record('Squat',315,'gold',74)}${record('Bench',275,'blue',65)}${record('Overhead',135,'green',32)}</div><div class="muted foot">All values in pounds · all-rep records</div></div><div class="widget medium maxes"><div>${header('maxes','Deadlift','STRONGEST LIFT')}<div class="value"><span class="number">425</span> <span class="unit">lb</span><div class="muted label">Logged Sep 22</div></div></div><div class="bars"><div><i style="height:78px;background:var(--blue)"></i>Bench</div><div><i style="height:91px;background:var(--gold)"></i>Squat</div><div><i style="height:121px;background:var(--purple)"></i>Dead</div><div><i style="height:40px;background:var(--green)"></i>OHP</div></div></div><div class="widget small maxes">${header('maxes','Maxes')}<div class="records">${record('Deadlift',425,'purple',100)}${record('Squat',315,'gold',74)}${record('Bench',275,'blue',65)}${record('Overhead',135,'green',32)}</div></div></section>`;
document.querySelector('#root').innerHTML=weight+diet+activity+maxes;
</script></body></html>
